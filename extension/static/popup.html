<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>MailPulse</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 340px; padding: 14px; display: grid; gap: 12px; }
      header { display: flex; align-items: center; justify-content: space-between; }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
      li a {
        display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px;
        border-radius: 8px; color: inherit; text-decoration: none;
      }
      li a:hover { background: var(--field); }
      .label { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sub { grid-column: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .badge { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 12px; font-weight: 500; }
      .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1><img src="icons/icon-48.png" alt="" />MailPulse</h1>
      <a href="options.html" target="_blank" class="muted">Options</a>
    </header>
    <label class="switch">
      Suivi automatique des mails Gmail
      <input type="checkbox" id="enabled" />
    </label>
    <section>
      <div class="muted" style="margin-bottom: 4px">Derniers mails suivis</div>
      <ul id="recent"><li class="muted">Chargement…</li></ul>
    </section>
    <div class="actions">
      <a id="dashboard" class="button primary" target="_blank">Ouvrir le tableau de bord</a>
      <button id="refresh" title="Vérifier les ouvertures maintenant">Actualiser</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
